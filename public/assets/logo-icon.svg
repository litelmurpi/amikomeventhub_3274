<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="emeraldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect fill="#0f172a" width="500" height="500" rx="100" />

  <g transform="translate(140, 125)">
    <path fill="url(#indigoGradIcon)" filter="url(#glowIcon)" d="
      M 110, 10
      C 170, 10 210, 50 210, 110
      A 12,12 0 0,1 186, 110
      C 186, 68 155, 34 110, 34
      C 65, 34 34, 68 34, 110
      A 12,12 0 0,1 10, 110
      C 10, 50 50, 10 110, 10 Z" />

    <rect fill="url(#indigoGradIcon)" x="45" y="85" width="24" height="115" rx="12" />

    <rect fill="url(#indigoGradIcon)" x="151" y="85" width="24" height="115" rx="12" />

    <g transform="translate(90, 115)">
      <rect fill="url(#emeraldGradIcon)" x="0" y="10" width="8" height="35" rx="4" />
      <rect fill="url(#emeraldGradIcon)" x="16" y="0" width="8" height="55" rx="4" filter="url(#glowIcon)" />
      <rect fill="url(#emeraldGradIcon)" x="32" y="10" width="8" height="35" rx="4" />
    </g>
  </g>
</svg>
