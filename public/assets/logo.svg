<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg { fill: #0f172a; }
      .brand-title { fill: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: 3px; }
      .brand-sub { fill: #10B981; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 6px; }
    </style>
  </defs>

  <rect class="bg" width="500" height="500" rx="36" />

  <g transform="translate(140, 90)">

    <path fill="url(#indigoGrad)" filter="url(#glow)" d="
      M 110, 10
      C 170, 10 210, 50 210, 110
      A 12,12 0 0,1 186, 110
      C 186, 68 155, 34 110, 34
      C 65, 34 34, 68 34, 110
      A 12,12 0 0,1 10, 110
      C 10, 50 50, 10 110, 10 Z" />

    <rect fill="url(#indigoGrad)" x="45" y="85" width="24" height="95" rx="12" />

    <rect fill="url(#indigoGrad)" x="151" y="85" width="24" height="95" rx="12" />

    <g transform="translate(90, 105)">
      <rect fill="url(#emeraldGrad)" x="0" y="10" width="8" height="30" rx="4" />
      <rect fill="url(#emeraldGrad)" x="16" y="0" width="8" height="50" rx="4" filter="url(#glow)" />
      <rect fill="url(#emeraldGrad)" x="32" y="10" width="8" height="30" rx="4" />
    </g>

  </g>

  <text x="250" y="340" class="brand-title" text-anchor="middle">AMIKOM</text>
  <text x="253" y="372" class="brand-sub" text-anchor="middle">EVENT HUB</text>
</svg>
